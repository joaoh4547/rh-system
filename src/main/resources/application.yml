spring:
  application:
    name: rh-system

  # Sem profile explícito (rodando na IDE / mvnw) usa "dev" (application-dev.yml).
  # A imagem Docker define SPRING_PROFILES_ACTIVE=prod: valem só os valores seguros abaixo.
  profiles:
    default: dev

  # Virtual threads (Project Loom): requisições do Tomcat, @Async/applicationTaskExecutor
  # e o scheduler do Spring passam a rodar em virtual threads. Desde o JDK 24 (JEP 491)
  # blocos synchronized não "prendem" mais a carrier thread, então JPA/JDBC/SMTP
  # bloqueantes escalam sem pool de threads gigante.
  # Atenção: o gargalo vira o pool do Hikari (default 10 conexões) — ele é o backpressure.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rh_system}
    # Sem default de propósito: em produção, sem a variável a aplicação nem sobe (fail-fast).
    # Os defaults de desenvolvimento (postgres/postgres) ficam no application-dev.yml.
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false

  # SMTP do Gmail. Use uma "Senha de app" do Google (não a senha normal da conta).
  # Configure as variáveis MAIL_USERNAME e MAIL_PASSWORD no ambiente.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${SERVER_PORT:8080}
  # Atrás do nginx: respeita X-Forwarded-Proto/For (cookie Secure, redirects e HSTS corretos)
  forward-headers-strategy: native
  servlet:
    session:
      # Sessão expira após este período sem atividade do usuário (inatividade)
      timeout: ${SESSION_TIMEOUT_MINUTES:60}m
      cookie:
        http-only: true
        same-site: lax
        # Secure por padrão (exige HTTPS). Para testar a stack Docker local em http,
        # use SESSION_COOKIE_SECURE=false no .env — nunca em produção.
        secure: ${SESSION_COOKIE_SECURE:true}

vaadin:
  # Fecha sessões ociosas: sem esta flag, os heartbeats do Vaadin mantêm a
  # sessão HTTP viva indefinidamente e o timeout por inatividade nunca ocorre.
  # Obs.: são parâmetros do servlet Vaadin (camelCase); o IDE pode marcar como
  # "propriedade desconhecida" por não haver metadata, mas funcionam normalmente.
  closeIdleSessions: true
  # Intervalo do heartbeat em segundos (deve ser menor que o timeout da sessão)
  heartbeatInterval: 300

logging:
  level:
    root: INFO
    # DEBUG só no profile dev: em produção os logs não devem carregar dados pessoais (LGPD)
    com.rhsystem: INFO

# Configurações da aplicação
rh-system:
  # URL base usada para montar o link de ativação enviado por email
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Remetente dos emails
  mail-from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@rhsystem.com}}
  # Validade do link de redefinição de senha (minutos) — curto de propósito
  password-reset-token-validity-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:30}
  # Diretório onde os anexos dos usuários serão armazenados
  storage-dir: ${STORAGE_DIR:./storage/documentos}
  # Sessão do usuário (timer exibido no footer + aviso de expiração)
  session:
    # Tempo de vida da sessão sem atividade, em minutos
    timeout-minutes: ${SESSION_TIMEOUT_MINUTES:60}
    # Antecedência (em minutos) com que o aviso de expiração é exibido
    warning-minutes: ${SESSION_WARNING_MINUTES:5}
  # Cache distribuído (Hazelcast embedded — sincronizado entre instâncias)
  cache:
    # Instâncias com o mesmo cluster-name formam um cluster e compartilham o cache
    cluster-name: ${HZ_CLUSTER_NAME:rh-system}
    # Lista de membros (host ou host:porta, separados por vírgula) para descoberta TCP-IP.
    # Vazio = descoberta por multicast (funciona em rede local / mesma máquina).
    members: ${HZ_MEMBERS:}
    # Porta base do cluster (incrementa automaticamente se ocupada)
    port: ${HZ_PORT:5701}
    # Validade das entradas do cache em segundos
    ttl-seconds: ${CACHE_TTL_SECONDS:600}
    debug-resolve-groups: ${CACHE_DEBUG_RESOLVE_GROUPS:false}
  aes:
    key: ${AES_KEY:}
  # Só usado fora de dev/test: se o usuário seed admin.teste ainda tiver a senha padrão,
  # ela é trocada por este valor; sem ele, o usuário é bloqueado (DefaultAdminCredentialsGuard).
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}